  type: has_one
  via: weight
  binding: $ref
- from: Order
  to: Volume
  type: has_one
  via: volume
  binding: $ref
- from: Order
  to: Dimensions
  type: has_one
  via: dimensions
  binding: $ref
- from: Order
  to: ParcelContent
  type: has_many
  via: parcel_contents
  binding: $ref
- from: Order
  to: Order
  type: has_one
  via: returnOrder (POST /orders/{id}/return)
  binding: operation
  note: >-
    A return is itself an Order, created against a parent order id. The contract does not
    expose a field on either side naming the other — the link exists only in the URL.
- from: Party
  to: Contact
  type: has_one
  via: contact
  binding: $ref
- from: Party
  to: Address
  type: has_one
  via: address
  binding: $ref
- from: Cover
  to: Price
  type: has_one
  via: price
  binding: $ref
- from: Price
  to: Money
  type: has_many
  via: gross / net / tax
  binding: $ref
- from: Manifest
  to: Order
  type: has_many
  via: GET /manifests/{id}/orders
  binding: operation
  note: >-
    Untyped. The manifest schema exposes only order_count; the member orders are reachable
    only through a separate operation whose response is not $ref'd to Order.
- from: Tracking
  to: Order
  type: belongs_to
  via: sendle_reference (path parameter `ref`)
  binding: id-reference
  note: >-
    A string join, not a $ref. Nothing in the Tracking schema names the order_id, so a
    client must persist sendle_reference at create time to ever track the parcel.
- from: Tracking
  to: TrackingEvent
  type: has_many
  via: tracking_events
  binding: $ref
observations:
- >-
  No Account, Customer, or User entity is exposed. Identity is implicit in the HTTP Basic
  credential, which is why there is no scopes/ artifact for this provider.
- >-
  Money and Address are each defined twice — once in the orders spec, once in the products
  spec (as Money and AddressOnly) — so quoting and ordering do not share types even though
  a client must move data between them.
- >-
  The webhook callback URL is account-level and configured in the dashboard, not modeled in
  the API at all. subscribeToTrackingEvents 422s when it is unset, and no operation can set
  it. See errors/sendle-problem-types.yml#semantic_variants.

source: >-
  Derived from $ref graphs and id-reference fields across
  openapi/sendle-orders-api-openapi.yml, sendle-products-api-openapi.yml,
  sendle-tracking-api-openapi.yml and sendle-manifests-api-openapi.yml. The object
  reference on developers.sendle.com could not be searched to enrich id-prefixes or
  domains — the host returned NXDOMAIN on 2026-08-26.
provider: sendle
title: Sendle API Data Model
description: >-
  Sendle's model has one root aggregate — Order — surrounded by value objects, and two
  satellites that reference an order by an OPAQUE STRING rather than by a typed link:
  Tracking (keyed by sendle_reference) and Manifest (a US-domestic batch of orders).
  There is no customer, account, or address-book entity in the public contract.
root_entities:
- name: Order
  api: sendle-orders-api
  identifier: order_id
  identifier_format: uuid
  secondary_identifier: sendle_reference
  secondary_identifier_note: >-
    Human-shaped shipment reference. This — not order_id — is the key the Tracking API
    accepts, so the two APIs are joined by a string a client must carry itself.
  operations:
  - createOrder
  - viewOrder
  - cancelOrder
  - returnOrder
  - viewReturnOrder
  states_field: state
  detail: The only writable, persistent, retrievable resource in the API.
- name: Manifest
  api: sendle-manifests-api
  identifier: id
  operations:
  - createShippingManifest
  - getShippingManifests
  - downloadShippingManifest
  - getShippingManifestOrders
  - getShippingManifestStatus
  fields:
  - id
  - created_at
  - state
  - type
  - order_count
  - pickup_date
  - download_url
  detail: >-
    A USPS SCAN Form batching many US-domestic orders under one barcode. Immutable once
    created — no update or delete operation exists.
- name: Tracking
  api: sendle-tracking-api
  identifier: ref (sendle_reference, path parameter)
  operations:
  - trackParcel
  - subscribeToTrackingEvents
  - unsubscribeFromTrackingEvents
  fields:
  - state
  - status
  - origin
  - destination
  - scheduling
  - tracking_events
  detail: A read projection over a parcel's scan history, not an independently created resource.
- name: ProductQuote
  api: sendle-products-api
  identifier: none
  persistent: false
  operations:
  - getProducts
  - postProducts
  - getQuote
  detail: >-
    Ephemeral. Quotes are computed per request and have no id, so a quote cannot be
    referenced later or attached to an order — the client re-sends product_code instead.
value_objects:
- name: Party
  composed_of:
  - Contact
  - Address
  used_by:
  - OrderRequest.sender
  - OrderRequest.receiver
  - Order.sender
  - Order.receiver
- name: Contact
  fields: [name, phone, email, company, sendle_id]
  note: >-
    sendle_id is the only cross-account identifier in the model — it links a party to a
    Sendle account without exposing an account entity.
- name: Address
  fields: [address_line1, address_line2, suburb, postcode, state_name, country]
- name: AddressOnly
  api: sendle-products-api
  fields: [address_line1, address_line2, suburb, postcode, country]
  note: >-
    A near-duplicate of Address minus state_name, defined separately in the products
    spec. The quoting surface and the ordering surface do not share an address type.
- name: Weight
  fields: [value, units]
- name: Volume
  fields: [value, units]
- name: Dimensions
  fields: [length, width, height, units]
- name: Money
  fields: [amount, currency]
  note: Defined independently in BOTH the orders and products specs.
- name: Price
  composed_of: [Money]
  fields: [gross, net, tax]
- name: Cover
  composed_of: [Price]
  fields: [total_cover, price]
  note: Parcel insurance.
- name: ParcelContent
  fields: [description, value, quantity, country_of_origin, hs_code, manufacturer_id]
  note: >-
    Customs line items. hs_code and country_of_origin are the international-shipping
    fields that make this a cross-border-capable model.
- name: Product
  fields: [code, name, first_mile_option, service, atl_only]
- name: Scheduling
  fields: [is_cancellable, pickup_date, picked_up_on, delivered_on, estimated_delivery_date_minimum, estimated_delivery_date_maximum]
  note: >-
    is_cancellable here is the same reversibility signal exposed as `cancellable` on the
    cancelOrder response. See conventions/sendle-conventions.yml#reversibility.
- name: Route
  fields: [description, type, delivery_guarantee_status]
- name: TrackingEvent
  fields: [event_type, scan_time, local_scan_time, display_time, description, location, location_data, origin_location, destination_location, reason, requester]
relationships:
- from: Order
  to: Party
  type: has_one
  via: sender
  binding: $ref
- from: Order
  to: Party
  type: has_one
  via: receiver
  binding: $ref
- from: Order
  to: Product
  type: has_one
  via: product
  binding: $ref

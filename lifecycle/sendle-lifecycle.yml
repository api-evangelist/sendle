source: >-
  Live DNS and HTTP probes on 2026-08-26 across every Sendle host in this repo,
  plus contemporaneous public reporting of the company's collapse and liquidation.
provider: sendle
title: Sendle API Lifecycle — Decommissioned
status: retired
summary: >-
  The Sendle API is gone. Not deprecated, not sunset with a migration window —
  withdrawn from DNS. As of 2026-08-26 api.sendle.com, developers.sendle.com,
  sandbox.sendle.com, status.sendle.com and try.sendle.com all return NXDOMAIN
  from the sendle.com authoritative nameservers. Sendle cancelled all deliveries
  on 2026-01-11 and the company entered liquidation. The five OpenAPI definitions
  in openapi/ are now an archival record of an API that can no longer be called.
lifecycle_state:
  api: retired
  contract: archived
  docs: gone
  status_page: gone
  sandbox: gone
  as_of: '2026-08-26'
company_status:
  state: liquidation
  ceased_operations: '2026-01-11'
  detail: >-
    Sendle, an Australian carbon-neutral parcel aggregator founded 2014, merged in
    2025 with US-based FirstMile and ACI Logistix to form Fast Group. The Fast Group
    board resolved to wind the business down on 2026-01-10; deliveries were cancelled
    2026-01-11; the entity entered liquidation, with McGrathNicol appointed as
    liquidators. Reported by ABC News, SmartCompany, Internet Retailing (AU) and ACS
    Information Age.
  note: >-
    Company status is recorded here because it is the ONLY thing that explains the
    lifecycle evidence below. It is not a substitute for the probes — every claim
    about a Sendle host in this file was verified by our own DNS/HTTP request.

deprecated_operations:
- api: sendle-products-api
  operationId: getQuote
  method: GET
  path: /quote
  summary: Get A Quote (Deprecated)
  deprecated: true
  replacement: getProducts (GET /products) and postProducts (POST /products)
  source: derived from openapi/sendle-products-api-openapi.yml
  note: >-
    The only operation Sendle ever marked deprecated in a machine-readable way. No
    sunset date was declared.

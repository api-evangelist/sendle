description: 'Sendle is a parcel delivery service built for small businesses, best known for 100%-carbon-neutral

  door-to-door shipping in Australia, the United States and Canada. The original operator, Sendle Pty

  Ltd, ceased trading in January 2026 and entered liquidation, and its API host, developer hub, sandbox

  and status page were withdrawn from DNS. In July 2026 McKenna Worldwide Services, an Australian

  logistics company with Quantium Solutions heritage, bought the Sendle brand, domain names and

  trademarks from the liquidators (not the company or its debts) and relaunched it, debuting the new

  Sendle at Online Retailer in Sydney on 22-23 July with operations expected by September 2026; Quantium

  Solutions handles the deliveries behind the customer-facing brand. As of 21 October 2026

  www.sendle.com answers again (pricing via the Sendlers Shippers Club membership, a support centre and

  self-serve signup), but api.sendle.com and developers.sendle.com still do not resolve and the relaunched

  site links to no API or developer documentation, so no API from the relaunched Sendle has been confirmed. The five OpenAPI definitions in this
  repository

  describe the original operator''s API (quoting, orders, labels, tracking, USPS SCAN-Form manifests and

  tracking webhooks over HTTP Basic Authentication) and are kept as the record of that contract.

  '


apis:
- aid: sendle:sendle-orders-api
  name: Sendle Orders API
  tags:
  - Order
  - Shipping
  - Labels
  tags_raw:
  - Orders
  - Shipping
  - Labels
  humanURL: https://www.sendle.com
  baseURL: https://api.sendle.com/api
  properties:
